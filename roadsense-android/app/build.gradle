plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.roadsense.app'
    compileSdk 34

    defaultConfig {
        applicationId "cn.roadsense.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
