name: 构建路感 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 platform / build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 生成 Gradle Wrapper（补齐 wrapper jar）
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传可下载的 APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadSense-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
